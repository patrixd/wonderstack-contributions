name: Add free training
description: A free course, video, guide or exercise that teaches a tool for a job. Becomes training/<slug>.md.
title: 'Add training: '
labels: ['add-training']
body:
  - type: markdown
    attributes:
      value: Only free training (no paywall, no trial that ends in a charge). Describe it in your own words.
  - type: input
    id: title
    attributes: { label: 'Title' }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: 'Link (https)' }
    validations: { required: true }
  - type: input
    id: tools
    attributes: { label: 'Tools it teaches (a file in tools/, or a tool already listed on WonderStack)', placeholder: 'claude, notebooklm' }
    validations: { required: true }
  - type: input
    id: job
    attributes: { label: 'Job (an id from jobs.json)', placeholder: 'plan_lessons' }
    validations: { required: true }
  - type: dropdown
    id: level
    attributes: { label: 'Level', options: [beginner, intermediate, advanced] }
    validations: { required: true }
  - type: input
    id: minutes
    attributes: { label: 'How many minutes it takes' }
    validations: { required: true }
  - type: dropdown
    id: licence
    attributes:
      label: Licence of the linked training
      options: [free-to-access, CC-BY-4.0, CC-BY-SA-4.0, CC0-1.0, MIT, Apache-2.0]
    validations: { required: true }
  - type: textarea
    id: description
    attributes: { label: 'What you learn (40–1500 characters, your own words)' }
    validations: { required: true }
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: It is free, my description contains no personal data, and I agree that it is published under Apache 2.0.
          required: true
        - label: I made this training or work for its publisher.
